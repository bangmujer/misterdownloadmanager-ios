name: MDM
options:
  bundleIdPrefix: com.bangmujer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  MDM:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources/ghostery-rules-1.json
      - path: Sources/Resources/ghostery-rules-2.json
      - path: Sources/Resources/ghostery-rules-3.json
      - path: Sources/Resources/ghostery-rules-4.json
      - path: Sources/Resources/ghostery-rules-5.json
      - path: Sources/Resources/ghostery-rules-6.json
      - path: Sources/Resources/ghostery-rules-7.json
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    # NOTE: no `info:` block here — XcodeGen's info spec requires a `path`,
    # and a properties-only block fails with: Decoding failed at "path":
    # Nothing found. The mdm:// URL scheme is deferred until a real
    # Info.plist is added; the generated Info.plist is used for now.
    settings:
      base:
        PRODUCT_NAME: "Mister Download Manager"
        PRODUCT_BUNDLE_IDENTIFIER: com.bangmujer.misterdownloadmanager
        MARKETING_VERSION: "0.6.3"
        # libsqlite3 is needed for `import SQLite3` (WQFiles-style SQLite viewer).
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Mister Download Manager"
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSAllowsArbitraryLoads: YES
        # "audio" is required for background media playback + Picture in
        # Picture. The value must use Xcode's own parenthesised-list form
        # (as Xcode itself writes it: "(audio)"); a plain string does NOT
        # become the UIBackgroundModes array, which silently disabled
        # background audio and PiP entirely.
        INFOPLIST_KEY_UIBackgroundModes: "(audio)"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
