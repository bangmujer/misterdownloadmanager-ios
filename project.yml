name: MDM
options:
  bundleIdPrefix: com.bangmujer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  MDM:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources/Localizable.xcstrings
      - path: Sources/Resources/ghostery-rules-1.json
      - path: Sources/Resources/ghostery-rules-2.json
      - path: Sources/Resources/ghostery-rules-3.json
      - path: Sources/Resources/ghostery-rules-4.json
      - path: Sources/Resources/ghostery-rules-5.json
      - path: Sources/Resources/ghostery-rules-6.json
      - path: Sources/Resources/ghostery-rules-7.json
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    # LESSON (2026-11-23): XcodeGen GENERATES AND OVERWRITES the file
    # at info.path on every `xcodegen generate` run — a hand-written
    # Info.plist committed to the repo NEVER survives to the device.
    # Custom keys MUST live in info.properties below. A hand-written
    # Info.plist (cb0e54a2–f2b69740) silently lost UILaunchScreen,
    # CFBundleDocumentTypes and CFBundleURLTypes on every CI build,
    # which letterboxed the app and killed share-sheet import.
    info:
      path: Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        CFBundleDisplayName: "Mister Download Manager"
        # Without this the plist version stays 1.0 and the in-app
        # build stamp reads "Build 1.0" on every build.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS blocks plain-HTTP LAN loads without this key (no prompt
        # appears at all) — it is what lets 10.128.4.218:5000 open.
        NSLocalNetworkUsageDescription: "Mister Download Manager memerlukan akses jaringan lokal untuk membuka server lokal di WiFi Anda, misalnya 10.128.4.218:5000."
        NSFaceIDUsageDescription: "Mister Download Manager memakai Face ID untuk menampilkan kata sandi tersimpan dan mengisi login di browser."
        NSCameraUsageDescription: "Mister Download Manager memerlukan akses kamera untuk mengambil foto dari halaman web yang Anda buka, misalnya saat mengunggah foto di halaman inspeksi."
        NSPhotoLibraryUsageDescription: "Mister Download Manager memerlukan akses galeri foto untuk memilih gambar dari halaman web yang Anda buka, misalnya saat mengunggah foto di halaman inspeksi."
        NSPhotoLibraryAddUsageDescription: "Mister Download Manager menyimpan gambar dari chat AI ke Foto saat Anda menekan tombol simpan."
        NSSpeechRecognitionUsageDescription: "Mister Download Manager mengubah ucapan Anda menjadi teks saat Anda menekan tombol mikrofon di chat AI."
        NSMicrophoneUsageDescription: "Mister Download Manager memerlukan akses mikrofon saat Anda menekan tombol mikrofon di chat AI untuk mengubah ucapan menjadi teks, dan saat halaman web yang Anda buka memintanya, misalnya panggilan suara atau perekaman di halaman tersebut."
        NSLocationWhenInUseUsageDescription: "Mister Download Manager memerlukan akses lokasi hanya saat halaman web yang Anda buka memintanya, misalnya peta atau layanan terdekat."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: "JavaScript source"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.javascript
              - public.plain-text
        CFBundleURLTypes:
          - CFBundleURLName: com.bangmujer.misterdownloadmanager
            CFBundleURLSchemes:
              - mdm
    settings:
      base:
        PRODUCT_NAME: "Mister Download Manager"
        PRODUCT_BUNDLE_IDENTIFIER: com.bangmujer.misterdownloadmanager
        MARKETING_VERSION: "0.6.104"
        # libsqlite3 is needed for `import SQLite3` (WQFiles-style SQLite viewer).
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Mister Download Manager"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
